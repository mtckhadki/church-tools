<!DOCTYPE html>
<html>
<head>
    <title>Church Tool</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Quill -->
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
    <script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>
</head>

<body class="bg-gray-100">

<div class="flex h-screen">

    <!-- SIDEBAR -->
    <div id="sidebar"
         class="bg-gray-900 text-white transition-all duration-300 w-16 flex flex-col">

        <!-- Top -->
        <div class="p-3 flex justify-between items-center border-b border-gray-700">
            <button onclick="toggleSidebar()">
                ☰
            </button>
        </div>

        <!-- Menu -->
        <nav class="flex-1 p-2 space-y-2">

            <a href="/" class="menu-item">
                <i data-lucide="layout-dashboard"></i>
                <span>Dashboard</span>
            </a>

            <a href="/xml-show" class="menu-item">
                <i data-lucide="file-up"></i>
                <span>XML → SHOW</span>
            </a>

            <a href="/show-xml" class="menu-item">
                <i data-lucide="file-down"></i>
                <span>SHOW → XML</span>
            </a>

            <a href="/announcement-ui" class="menu-item">
                <i data-lucide="megaphone"></i>
                <span>Announcements</span>
            </a>

        </nav>
    </div>

    <!-- MAIN -->
    <div class="flex-1 flex flex-col">

        <!-- HEADER -->
        <div class="bg-white shadow p-4 flex justify-between">
            <h1 class="text-xl font-semibold">Church Tool</h1>
        </div>

        <!-- CONTENT -->
        <div class="p-6 overflow-auto flex-1">
            {% block content %}{% endblock %}
        </div>
    </div>

</div>

<!-- Styles -->
<style>
.menu-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px;
    border-radius: 8px;
    transition: background 0.2s;
}

.menu-item:hover {
    background: #374151;
}

.menu-item span {
    display: none;
}

.sidebar-expanded {
    width: 220px !important;
}

.sidebar-expanded .menu-item span {
    display: inline;
}
</style>

<!-- Script -->
<script>
function toggleSidebar() {
    let sidebar = document.getElementById("sidebar");
    sidebar.classList.toggle("sidebar-expanded");
}

lucide.createIcons();
</script>

</body>
</html>
