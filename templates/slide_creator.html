{% extends "layout.html" %}

{% block content %}

<div class="grid grid-cols-2 gap-4 h-[80vh]">

    <!-- LEFT PANEL -->
    <div class="bg-white p-4 rounded shadow overflow-y-auto">

        <div class="flex justify-between mb-3">
            <h2 class="font-bold">Slides</h2>
            <div class="space-x-2">
                <button onclick="addSlide()" class="bg-blue-600 text-white px-3 py-1 rounded">+ Add</button>
                <button onclick="newSlide()" class="bg-gray-600 text-white px-3 py-1 rounded">New</button>
            </div>
        </div>

        <div id="slides"></div>

    </div>

    <!-- RIGHT PREVIEW -->
    <div class="bg-black flex items-center justify-center rounded shadow">
        <canvas id="canvas" width="1280" height="720"></canvas>
    </div>

</div>

<div class="mt-4">
    <button onclick="generateSlides()" class="bg-green-600 text-white px-4 py-2 rounded">
        Generate Slides
    </button>
</div>

<script src="/static/js/slide_creator.js"></script>

{% endblock %}
