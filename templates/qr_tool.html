{% extends "layout.html" %}

{% block content %}

<h2 class="text-xl font-bold mb-4">QR Generator</h2>

<div class="bg-white p-4 rounded shadow max-w-lg">

    <!-- TEMPLATE -->
    <label class="block mb-1">Template</label>
    <select id="template" class="border p-2 w-full mb-3">
        <option value="google_maps">Google Maps</option>
        <option value="google_form">Google Form</option>
        <option value="website">Website</option>
    </select>

    <!-- LINK -->
    <label class="block mb-1">Link / URL</label>
    <input id="link" class="border p-2 w-full mb-3">

    <!-- LOGO -->
    <label class="block mb-1">Center Logo (optional)</label>
    <input type="file" id="logo" class="mb-3">

    <button onclick="generateQR()" 
        class="bg-blue-600 text-white px-4 py-2 rounded w-full">
        Generate QR
    </button>

</div>

<div id="result" class="mt-4"></div>

<script src="/static/js/qr.js"></script>

{% endblock %}
