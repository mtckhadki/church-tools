{% extends "layout.html" %}

{% block content %}

<!-- SEARCH -->
<div class="mb-6">
    <input 
        id="search"
        placeholder="Search tools..."
        class="w-full border p-3 rounded shadow-sm focus:ring-2 focus:ring-blue-400"
        onkeyup="filterCards()"
    >
</div>

<!-- CARDS -->
<div id="cards" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">

    <div class="card" data-name="xml show converter">
        <h2>XML → SHOW</h2>
        <p>Convert OpenLP XML to Freeshow</p>
        <a href="/xml-show">Open</a>
    </div>

    <div class="card" data-name="show xml converter">
        <h2>SHOW → XML</h2>
        <p>Convert Freeshow to OpenLP XML</p>
        <a href="/show-xml">Open</a>
    </div>

    <div class="card" data-name="announcement creator">
        <h2>Announcements</h2>
        <p>Create formatted announcement slides</p>
        <a href="/announcement-ui">Open</a>
    </div>

</div>

<style>
.card {
    background: white;
    padding: 20px;
    border-radius: 12px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.05);
    transition: transform 0.2s, box-shadow 0.2s;
}

.card:hover {
    transform: translateY(-5px);
    box-shadow: 0 10px 20px rgba(0,0,0,0.1);
}

.card h2 {
    font-size: 18px;
    font-weight: bold;
    margin-bottom: 8px;
}

.card p {
    color: #555;
    margin-bottom: 12px;
}

.card a {
    color: #2563eb;
    font-weight: 500;
}
</style>

<script>
function filterCards() {
    let input = document.getElementById("search").value.toLowerCase();
    let cards = document.querySelectorAll(".card");

    cards.forEach(card => {
        let name = card.dataset.name;
        card.style.display = name.includes(input) ? "block" : "none";
    });
}
</script>

{% endblock %}
