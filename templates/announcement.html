{% extends "layout.html" %}

{% block content %}

<div class="grid grid-cols-2 gap-4 h-[75vh]">

    <!-- LEFT: EDITOR -->
    <div class="bg-white p-4 rounded shadow overflow-y-auto">
        <h2 class="font-bold mb-3">Editor</h2>

        <div id="sections"></div>

        <button onclick="addSection()" class="mt-3 bg-blue-600 text-white px-3 py-1 rounded">
            + Add Section
        </button>
    </div>

    <!-- RIGHT: PREVIEW -->
    <div class="bg-black text-white p-4 rounded shadow overflow-y-auto">
        <h2 class="mb-3">Preview</h2>
        <div id="preview"></div>
    </div>

</div>

<div class="mt-4">
    <button onclick="generateXML()" class="bg-green-600 text-white px-4 py-2 rounded">
        Export
    </button>
</div>

<script src="/static/js/announcement.js"></script>

{% endblock %}
