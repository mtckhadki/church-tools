{% extends "layout.html" %}

{% block content %}

<h1 class="text-2xl font-bold mb-4">Create Announcements</h1>

<div class="bg-white p-4 rounded shadow h-[75vh] flex flex-col">

    <!-- Scrollable Sections -->
    <div id="sections" class="flex-1 overflow-y-auto pr-2"></div>

    <!-- Bottom Controls -->
    <div class="mt-4 flex justify-between items-center border-t pt-3">
        <button onclick="addSection()" 
            class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded">
            + Add Section
        </button>

        <button onclick="generateXML()" 
            class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded">
            Export
        </button>
    </div>

</div>

<div id="result" class="mt-4"></div>

<script src="/static/js/announcement.js"></script>

{% endblock %}
